[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ['@safe=lib/safe-smart-account/', '@openzeppelin=lib/openzeppelin-contracts/']
optimizer = true
optimizer_runs = 1000000000

[rpc_endpoints]
goerli = "${GOERLI_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"
base = "${BASE_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"
sonic = "${SONIC_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"


[etherscan]
mainnet  = { key = "${ETHERSCAN_API_KEY}", chain = 1 }
sepolia  = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
base     = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
arbitrum = { key = "${ARBISCAN_API_KEY}", chain = 42161 }
sonic    = { key = "${ETHERSCAN_API_KEY}", chain = 146 }
polygon  = { key = "${ETHERSCAN_API_KEY}", chain = 137 }


# See more config options https://github.com/foundry-rs/foundry/tree/master/config
