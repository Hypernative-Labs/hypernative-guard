[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ['@safe=lib/safe-contracts/', '@openzeppelin=lib/openzeppelin-contracts/']

[rpc_endpoints]
goerli = "${GOERLI_RPC_URL}"


[etherscan]
escan = { key = "${ETHERSCAN_API_KEY}" }


# See more config options https://github.com/foundry-rs/foundry/tree/master/config
