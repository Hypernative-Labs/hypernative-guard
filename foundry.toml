[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ['@safe=lib/safe-smart-account/', '@openzeppelin=lib/openzeppelin-contracts/']
optimizer = true
optimizer_runs = 1000000000

[rpc_endpoints]
goerli = "${GOERLI_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"
base = "${BASE_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"
sonic = "${SONIC_RPC_URL}"


[etherscan]
escan = { key = "${ETHERSCAN_API_KEY}" }
arbiscan = { key = "${ARBISCAN_API_KEY}" }


# See more config options https://github.com/foundry-rs/foundry/tree/master/config
